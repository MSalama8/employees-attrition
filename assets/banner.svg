<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="340" viewBox="0 0 1440 340" role="img" aria-labelledby="title desc">
  <title id="title">Employee Attrition Analysis</title>
  <desc id="desc">A restrained workforce analytics banner showing a flow from raw data through preprocessing to SQL analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091321"/>
      <stop offset="56%" stop-color="#102638"/>
      <stop offset="100%" stop-color="#17384A"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#42BDAF" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#42BDAF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#C5D5E3" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#142F42" stop-opacity=".94"/>
      <stop offset="100%" stop-color="#0C1C2B" stop-opacity=".8"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1440" height="340" rx="18" fill="url(#glow)"/>
  <rect width="1440" height="340" rx="18" fill="url(#grid)"/>
  <path d="M710 0 C830 82 810 224 930 340" fill="none" stroke="#78D9CB" stroke-opacity=".10" stroke-width="1.5"/>
  <path d="M760 0 C880 82 860 224 980 340" fill="none" stroke="#78D9CB" stroke-opacity=".06" stroke-width="1.5"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="76" y="66" fill="#77DACA" font-size="13" font-weight="700" letter-spacing="3.1">WORKFORCE ANALYTICS</text>
    <rect x="76" y="88" width="54" height="3" rx="1.5" fill="#65D2C1"/>
    <text x="76" y="142" fill="#F2F6FA" font-size="39" font-weight="700" letter-spacing=".2">EMPLOYEE ATTRITION</text>
    <text x="76" y="189" fill="#F2F6FA" font-size="39" font-weight="700" letter-spacing=".2">ANALYSIS</text>
    <text x="78" y="229" fill="#C4D3E0" font-size="16">Structured HR data. Reproducible preparation.</text>
    <text x="78" y="253" fill="#C4D3E0" font-size="16">Clear, descriptive insights.</text>
    <line x1="78" y1="285" x2="590" y2="285" stroke="#A8BAC9" stroke-opacity=".28"/>
    <text x="78" y="310" fill="#D9E5ED" font-size="11" font-weight="600" letter-spacing="2.0">PYTHON</text>
    <circle cx="158" cy="306" r="2.5" fill="#65D2C1"/>
    <text x="174" y="310" fill="#D9E5ED" font-size="11" font-weight="600" letter-spacing="2.0">PANDAS</text>
    <circle cx="256" cy="306" r="2.5" fill="#65D2C1"/>
    <text x="272" y="310" fill="#D9E5ED" font-size="11" font-weight="600" letter-spacing="2.0">POSTGRESQL</text>
  </g>

  <g transform="translate(790 42)">
    <rect x="0" y="0" width="582" height="256" rx="17" fill="url(#panel)" stroke="#6F91A8" stroke-opacity=".33"/>
    <text x="28" y="31" fill="#A9C0D0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2.2">ANALYSIS PIPELINE</text>

    <g opacity=".55" stroke="#7898AC" stroke-width="1">
      <line x1="29" y1="104" x2="548" y2="104" stroke-dasharray="3 7"/>
      <line x1="29" y1="133" x2="548" y2="133" stroke-dasharray="3 7"/>
    </g>
    <g fill="#65D2C1" fill-opacity=".18">
      <rect x="42" y="70" width="16" height="34" rx="3"/>
      <rect x="66" y="57" width="16" height="47" rx="3"/>
      <rect x="90" y="80" width="16" height="24" rx="3"/>
      <rect x="114" y="48" width="16" height="56" rx="3"/>
      <rect x="138" y="65" width="16" height="39" rx="3"/>
      <rect x="162" y="39" width="16" height="65" rx="3"/>
    </g>
    <path d="M42 91 C89 45 124 76 165 55 S236 80 276 46 S350 62 397 35 S477 52 536 25" fill="none" stroke="#72DCCB" stroke-width="2.2" stroke-linecap="round" opacity=".95"/>
    <g fill="#E2FBF6" stroke="#4BB9AA" stroke-width="1.5">
      <circle cx="42" cy="91" r="4"/>
      <circle cx="165" cy="55" r="4"/>
      <circle cx="276" cy="46" r="4"/>
      <circle cx="397" cy="35" r="4"/>
      <circle cx="536" cy="25" r="4"/>
    </g>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
      <rect x="28" y="153" width="145" height="65" rx="10" fill="#193A4E" stroke="#64859A" stroke-opacity=".7"/>
      <rect x="218" y="153" width="145" height="65" rx="10" fill="#164044" stroke="#6BCBBB" stroke-opacity=".78"/>
      <rect x="408" y="153" width="145" height="65" rx="10" fill="#193A4E" stroke="#64859A" stroke-opacity=".7"/>
      <path d="M176 185 H207 l-7 -6 M207 185 l-7 6" fill="none" stroke="#83DACA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M366 185 H397 l-7 -6 M397 185 l-7 6" fill="none" stroke="#83DACA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="100" y="180" fill="#EEF5F8" font-size="11" font-weight="700" letter-spacing="1.1">RAW DATA</text>
      <text x="100" y="199" fill="#B8CBD7" font-size="10">Inspect</text>
      <text x="290" y="180" fill="#F0FFFC" font-size="11" font-weight="700" letter-spacing=".8">PREPROCESS</text>
      <text x="290" y="199" fill="#BFE5DF" font-size="10">Clean &amp; validate</text>
      <text x="480" y="180" fill="#EEF5F8" font-size="11" font-weight="700" letter-spacing="1.1">SQL ANALYSIS</text>
      <text x="480" y="199" fill="#B8CBD7" font-size="10">Explore patterns</text>
    </g>
  </g>
</svg>